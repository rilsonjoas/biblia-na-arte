name: Test Instagram Token

# Workflow temporário só pra confirmar que INSTAGRAM_ACCESS_TOKEN e
# INSTAGRAM_ACCOUNT_ID (secrets) funcionam de verdade, antes de escrever
# o workflow real de publicação diária (ROADMAP "Publicação automática
# — Arte Cristã Diária"). Chamada de LEITURA apenas — não publica nada.
# Remover depois que a automação de verdade estiver rodando.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica token + conta do Instagram
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          response=$(curl -s -G "https://graph.instagram.com/v21.0/${IG_ACCOUNT_ID}" \
            --data-urlencode "fields=id,username,account_type" \
            --data-urlencode "access_token=${IG_TOKEN}")
          echo "Resposta da API:"
          echo "$response"
          echo "$response" | grep -q '"username"' && echo "✅ Token válido — conta acessível." || (echo "❌ Token inválido ou conta inacessível." && exit 1)
