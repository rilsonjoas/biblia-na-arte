name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Garante que nenhum passo baixe objeto LFS por fora do `lfs: false` do
# checkout (ex.: git-lfs instalado no runner fazendo smudge sozinho).
env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biblia_test
          POSTGRES_PASSWORD: biblia_test
          POSTGRES_DB: biblia_na_arte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblia_test -d biblia_na_arte_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql://biblia_test:biblia_test@localhost:5432/biblia_na_arte_test

    steps:
      # lfs: false de propósito (2026-09-27). Com lfs: true, cada job
      # baixava as ~228 MB de pinturas em LFS (~680 MB por push, com os 3
      # jobs de então) e estourou a cota de 10 GB/mês de banda LFS da
      # conta: o GitHub conta download do Actions na cota e desliga o LFS
      # até o próximo ciclo. Os testes geram as próprias imagens e o build
      # só copia web/public. Ver docs/RUNBOOK.md, "Cota de banda do Git LFS".
      #
      # Os jobs docker-api/docker-web (build + push no GHCR) foram
      # removidos no mesmo dia: o VPS builda do próprio checkout
      # (`make deploy` = `compose up --build`) e nunca usou essas imagens.
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Sem `version:` de propósito (achado 2026-09-03): agora que
      # package.json tem `packageManager` fixando a versão exata do pnpm,
      # essa action recusa rodar se as duas fontes coexistirem
      # ("Multiple versions of pnpm specified") — packageManager já é
      # suficiente, e é a mesma fonte que o Dockerfile/reseed usam.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Testes de integração (Postgres service)
        run: pnpm test:integration

      - name: Build web
        run: pnpm build:web

      - name: Build server
        run: pnpm build:server

      - name: Auditoria de dependências
        # pnpm audit consulta registry.npmjs.org e volta e meia falha por
        # timeout de rede (ERR_SOCKET_TIMEOUT/FetchError) sem nenhuma
        # vulnerabilidade real envolvida — o retry interno do próprio pnpm
        # (3 tentativas) às vezes não é suficiente (2026-09-03). Distingue
        # falha de rede (tenta de novo) de vulnerabilidade real encontrada
        # (falha na hora, não adianta insistir).
        run: |
          set -uo pipefail
          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            output=$(pnpm audit --audit-level=high 2>&1)
            status=$?
            echo "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if echo "$output" | grep -qE 'ERR_SOCKET_TIMEOUT|FetchError|ETIMEDOUT|ECONNRESET'; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "▶ Falha de rede ao consultar o registry (tentativa $attempt/$max_attempts) — tentando de novo em 30s..."
                sleep 30
                continue
              fi
              echo "❌ Falha de rede persistente depois de $max_attempts tentativas — não deu pra confirmar se há vulnerabilidade real, então o CI falha por segurança."
              exit 1
            fi
            echo "❌ pnpm audit encontrou vulnerabilidade(s) de severidade alta — não é falha de rede, não adianta tentar de novo."
            exit 1
          done

  deploy:
    # Só roda depois que os 6 passos do CI passaram. Antes (2026-09-27) o
    # deploy era um workflow separado, disparado pelo mesmo push em
    # paralelo: o GitHub mostrava "Deploy VPS ✅" ao lado de "CI ❌" e o
    # código ia pro ar com teste vermelho. Fundir resolve e ainda dá uma
    # barra só em vez de duas.
    needs: ci
    # `ci.yml` também roda em pull_request, e não existe VPS para o PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Deploy no VPS (git pull + rebuild)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Achado 2026-09-03: sem isso, um passo falhando no meio (ex.:
            # `git pull --ff-only` bloqueado por mudança local não commitada)
            # não parava o script nem derrubava o job — "Deploy VPS" reportava
            # sucesso mesmo com o código antigo ainda no ar, porque os comandos
            # seguintes rodavam e terminavam bem por conta própria.
            set -euo pipefail

            # Guarda de disco (INCIDENTES.md no infra, 2026-08-23): aborta
            # antes de piorar se a raiz estiver >=90%.
            USO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            if [ "$USO" -ge 90 ]; then
              echo "❌ Abortado: disco em ${USO}% (limite 90%). Rode: docker builder prune -af"
              exit 1
            fi
            cd /opt/biblia-na-arte
            git pull --ff-only origin main
            cd ~/hetzner-infra
            make deploy service=biblia-na-arte
            # Prune total pós-deploy (INCIDENTES.md 2026-08-23): sem filtro de
            # tempo — filtros semanais não pegam rajadas; e o prune simples (-f)
            # deixa registros compartilhados no disco (17,9GB invisíveis).
            # Achado 2026-09-19: deploys de repos DIFERENTES no mesmo host não
            # são serializados (o `concurrency` do Actions é por repositório),
            # então dois prunes concorrentes fazem o daemon responder
            # "a prune operation is already running" — com `set -euo pipefail`
            # isso derrubava a job DEPOIS do deploy ter dado certo. Retry curto:
            # a disputa dura segundos. Se ainda falhar, segue mesmo assim — o
            # guard de disco (>=90%) do próximo deploy cobre acúmulo real.
            for CMD in "builder prune -af" "image prune -f"; do
              OK=0
              for i in $(seq 1 5); do
                if docker $CMD >/dev/null 2>&1; then OK=1; break; fi
                sleep 10
              done
              [ "$OK" -eq 1 ] || echo "⚠️  docker $CMD não concluiu em 5 tentativas"
            done
            USO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            echo "✅ Deploy ok — disco em ${USO}%"

      - name: Smoke test
        run: |
          # Achado 2026-08-16: "sleep 3" fixo dava falso-negativo (container
          # às vezes ainda reiniciando) mesmo com o deploy tendo funcionado.
          # Retry de verdade: até 10 tentativas, 3s entre elas.
          for url in https://biblianaarte.narniano.com/ https://api-biblianaarte.narniano.com/health; do
            for i in $(seq 1 10); do
              curl -sf -o /dev/null "$url" && break
              [ "$i" -eq 10 ] && exit 1
              sleep 3
            done
          done
