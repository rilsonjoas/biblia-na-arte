name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biblia_test
          POSTGRES_PASSWORD: biblia_test
          POSTGRES_DB: biblia_na_arte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblia_test -d biblia_na_arte_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql://biblia_test:biblia_test@localhost:5432/biblia_na_arte_test

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Sem `version:` de propósito (achado 2026-09-03): agora que
      # package.json tem `packageManager` fixando a versão exata do pnpm,
      # essa action recusa rodar se as duas fontes coexistirem
      # ("Multiple versions of pnpm specified") — packageManager já é
      # suficiente, e é a mesma fonte que o Dockerfile/reseed usam.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Testes de integração (Postgres service)
        run: pnpm test:integration

      - name: Build web
        run: pnpm build:web

      - name: Build server
        run: pnpm build:server

      - name: Auditoria de dependências
        # pnpm audit consulta registry.npmjs.org e volta e meia falha por
        # timeout de rede (ERR_SOCKET_TIMEOUT/FetchError) sem nenhuma
        # vulnerabilidade real envolvida — o retry interno do próprio pnpm
        # (3 tentativas) às vezes não é suficiente (2026-09-03). Distingue
        # falha de rede (tenta de novo) de vulnerabilidade real encontrada
        # (falha na hora, não adianta insistir).
        run: |
          set -uo pipefail
          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            output=$(pnpm audit --audit-level=high 2>&1)
            status=$?
            echo "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if echo "$output" | grep -qE 'ERR_SOCKET_TIMEOUT|FetchError|ETIMEDOUT|ECONNRESET'; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "▶ Falha de rede ao consultar o registry (tentativa $attempt/$max_attempts) — tentando de novo em 30s..."
                sleep 30
                continue
              fi
              echo "❌ Falha de rede persistente depois de $max_attempts tentativas — não deu pra confirmar se há vulnerabilidade real, então o CI falha por segurança."
              exit 1
            fi
            echo "❌ pnpm audit encontrou vulnerabilidade(s) de severidade alta — não é falha de rede, não adianta tentar de novo."
            exit 1
          done

  docker-api:
    name: Build & Push API
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/biblianaarte-api
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-web:
    name: Build & Push Web
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/biblianaarte-web
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          build-args: |
            VITE_API_URL=https://api-biblianaarte.narniano.com
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
