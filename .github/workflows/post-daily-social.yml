name: Publicar Pintura do Dia (Instagram + Threads)

# Publica automaticamente a Pintura do Dia (GET /artworks/daily) na
# conta @artecristadiaria (Instagram) e no Threads, todo dia. Ver
# docs/ROADMAP.md — "Publicação automática — Arte Cristã Diária" — pra
# todo o histórico da configuração de cada plataforma e decisões
# tomadas.
#
# Facebook tirado do padrão em 2026-09-11 — decisão do Rilson, não
# pendência técnica: a Página nunca teve retorno de engajamento que
# justificasse manter, e o token dela invalida com frequência (mesma
# classe de incidente documentada abaixo). Continua dando pra publicar
# lá manualmente via workflow_dispatch (`platforms: instagram,facebook,threads`)
# se um dia a decisão mudar — o código e os secrets não foram removidos,
# só o padrão automático.
#
# Roda em GitHub Actions (não no VPS) de propósito: sem cron novo pra
# manter, sem log crescendo em disco — o histórico de execuções já vive
# no próprio Actions. Script é standalone (scripts/post-daily-social.mjs),
# sem instalar dependências.

on:
  # SEM `schedule:` de propósito (removido 2026-09-07) — o agendador do
  # Actions é best-effort, sem SLA, e não dava pra confiar nele mesmo
  # depois de mudar o minuto (achado de 04/09, comentário abaixo tinha
  # o histórico): confirmado no histórico real de execuções atraso de
  # 2h30-3h consistente em 05/09 e 06/09, crescendo dia a dia, além do
  # dia 04/09 em que simplesmente não rodou nenhuma vez, sem erro nem
  # rastro. Limite documentado da própria GitHub, mais comum em
  # repositórios de baixo tráfego como este.
  #
  # O gatilho de horário agora vive fora do GitHub: um cron na VPS
  # (`scripts/trigger-daily-post.sh`, ~08:13 em São Paulo — depois que o
  # dia já virou pra Pintura do Dia, que usa fuso de São Paulo, ver
  # "Bug 1" no ROADMAP) chama este workflow via API
  # (`workflow_dispatch`), que executa quase na hora, sem fila. A
  # publicação em si continua 100% aqui no Actions, como sempre foi de
  # propósito — só o "aperta o botão" saiu daqui.
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Quais publicar (separado por vírgula): instagram,facebook,threads'
        required: false
        default: 'instagram,threads'

permissions:
  contents: read

concurrency:
  group: post-daily-social
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publica a Pintura do Dia
        env:
          # No disparo via VPS (workflow_dispatch sem inputs) cai no
          # padrão (Instagram+Threads — Facebook tirado do padrão em
          # 2026-09-11, decisão do Rilson, ver comentário no topo do
          # arquivo). No disparo manual, respeita o que foi escolhido —
          # inclusive `facebook`, se um dia quiser publicar lá nesse dia
          # específico sem mudar o padrão.
          PLATFORMS: ${{ github.event.inputs.platforms || 'instagram,threads' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: node scripts/post-daily-social.mjs
