name: Deploy VPS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Deploy no VPS (git pull + rebuild)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/biblia-na-arte
            git pull --ff-only origin main
            cd ~/hetzner-infra
            make deploy service=biblia-na-arte

      - name: Smoke test
        run: |
          # Achado 2026-08-16: "sleep 3" fixo dava falso-negativo (container
          # às vezes ainda reiniciando) mesmo com o deploy tendo funcionado.
          # Retry de verdade: até 10 tentativas, 3s entre elas.
          for url in https://biblianaarte.narniano.com/ https://api-biblianaarte.narniano.com/health; do
            for i in $(seq 1 10); do
              curl -sf -o /dev/null "$url" && break
              [ "$i" -eq 10 ] && exit 1
              sleep 3
            done
          done
