# Postgres isolado pros testes de integração da API.
# Uso: docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: biblianaarte-postgres-test
    environment:
      POSTGRES_USER: biblia_test
      POSTGRES_PASSWORD: biblia_test
      POSTGRES_DB: biblia_na_arte_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U biblia_test -d biblia_na_arte_test']
      interval: 2s
      timeout: 2s
      retries: 15
