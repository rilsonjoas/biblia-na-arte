    <!-- Fontes via <link> + preconnect, não @import no CSS (achado real
         2026-08-22): @import é bloqueante em cadeia — o navegador só
         descobre o pedido da fonte depois de baixar E parsear o CSS que
         contém o @import, então o "preload scanner" (que já dispara
         fetches assim que encontra <link> no HTML, em paralelo com tudo
         o mais) nunca vê essa requisição cedo. As 3 famílias (antes 3
         @imports = 3 round-trips em cadeia) viraram 1 request só. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <meta name="google-site-verification" content="GZKfUeS1__5B7yeJQ0mV3q72MYtwx7mg25uIngyYVME" />
    <meta name="google-adsense-account" content="ca-pub-5482566824255473" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5482566824255473"
      crossorigin="anonymous"
    ></script>
    <!-- Achado 2026-09-01: a exclusão de páginas configurada no painel do
         AdSense (conta compartilhada com narniano.com, que tem Anúncios
         Automáticos ativado) não bloqueou o espaço reservado que seguia
         aparecendo entre elementos do layout (ex.: gap enorme abaixo da
         imagem da obra) — exclusão por painel é assíncrona (documentada
         em até ~24h pra propagar) e, na prática, não é confiável. Este
         push com `enable_page_level_ads: false` é o opt-out oficial via
         código, avaliado no cliente assim que o script carrega, sem
         depender do painel. NÃO afeta os slots manuais (<AdUnit>, que
         fazem seu próprio push({}) com data-ad-slot) — page-level e
         slot manual são mecanismos independentes no adsbygoogle.js. -->
    <script>
      (window.adsbygoogle = window.adsbygoogle || []).push({
        google_ad_client: "ca-pub-5482566824255473",
        enable_page_level_ads: false,
      });
    </script>
