server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers (OWASP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP liberado pro Google AdSense (2026-08-22): script-src pro loader
    # (pagead2/tpc.googlesyndication.com), frame-src pros iframes do
    # próprio anúncio (doubleclick/googlesyndication/adtrafficquality —
    # cada anúncio roda num browsing context isolado, com seu próprio
    # CSP, então isso aqui só libera o carregamento dos iframes em si,
    # não o script-src *dentro* deles), img-src pros pixels de
    # rastreamento e connect-src pras chamadas de requisição de anúncio.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://www.googletagservices.com https://ep2.adtrafficquality.google; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://pagead2.googlesyndication.com https://www.google.com https://ep2.adtrafficquality.google; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://pagead2.googlesyndication.com https://www.google.com https://googleads.g.doubleclick.net; connect-src 'self' https://api-biblianaarte.narniano.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.google.com https://ep2.adtrafficquality.google;" always;

    # Imagens do catálogo (853 arquivos, ~111MB em WebP — antes ~960MB em
    # jpg/png, ver ROADMAP.md "Pipeline de imagens", 2026-08-15) — cache
    # agressivo, são obras curadas fixas, não mudam depois de publicadas.
    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Assets com hash no nome (JS/CSS gerados pelo Vite) — cache agressivo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Sitemap do Google (320KB com as obras) — cache de 1h e gzip pra o
    # Googlebot nunca dar timeout na busca.
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA: qualquer rota que não seja arquivo estático cai no index.html,
    # o React Router assume a partir daí.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 1024;
}
