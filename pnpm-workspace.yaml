packages:
  - "web"
  - "server"

# pnpm 10+ não lê mais "pnpm.overrides"/"pnpm.onlyBuiltDependencies" do
# package.json — movido pra cá (achado 2026-08-16 ao reseedar em produção:
# o campo antigo era silenciosamente ignorado, com aviso no stderr).
overrides:
  vite: "^6.4.3"
  esbuild: "^0.25.0"
  # CVEs "high" de fast-uri (achado 2026-09-02) — movido de package.json
  # (`pnpm.overrides`) pro lugar certo em 2026-09-03: o campo antigo
  # funcionava com pnpm 10.x local, mas o comando de reseed em produção
  # não fixa versão do pnpm e puxou pnpm 11.x via corepack, que já não lê
  # mais o campo velho — mesmo aviso do comentário acima, achado de novo
  # na prática, ver ROADMAP.
  fast-uri: ">=4.1.3"
  # CVE "high" de js-yaml (achado 2026-09-08, CI bloqueou o push do
  # re-export do vault) — transitiva via eslint>@eslint/eslintrc,
  # devDependency, nunca chega em produção, mas o pnpm audit não
  # diferencia isso e o CI trava mesmo assim.
  js-yaml: ">=4.3.2"
  # CVE "high" de source-map-js (achado 2026-10-12, GHSA-68fv-2mgg-jv7q: DoS no
  # event loop por offsets de seção em source map indexado, corrigido em 1.2.2)
  # — transitiva via web>jsdom>css-tree, só em teste; css-tree aceita ^1.2.1, então
  # o piso 1.2.2 é compatível. O pnpm audit não diferencia dev de prod.
  source-map-js: ">=1.2.2"

onlyBuiltDependencies:
  - esbuild
  - sharp
  - "@swc/core"

# Avisos que o `pnpm audit` acusa e que NÃO têm correção publicada. Cada item
# precisa de justificativa e de uma condição de remoção; lista curta de propósito.
auditConfig:
  ignoreGhsas:
    # braces <= 3.0.3 (DoS por padrões de chaves aninhados em excesso). Achado
    # 2026-10-12. Sem versão corrigida: 3.0.3 é a última publicada. Caminho:
    # web>tailwindcss>chokidar>braces, ferramenta de build lendo os padrões de
    # arquivo do próprio repo; não vai pro bundle, não roda no servidor e nenhuma
    # entrada externa chega nela. REMOVER este item quando o braces publicar
    # versão corrigida (ou quando o tailwindcss sair do chokidar 3).
    - GHSA-vfj7-8cjw-p6xm
